<mat-card class="farm-card" appearance="outlined">
    @if (farm().image && !imageFailed()) {
        <img class="farm-card__media" [src]="farm().image" alt="" loading="lazy" (error)="imageFailed.set(true)">
    } @else {
        <div class="farm-card__media farm-card__media--placeholder" aria-hidden="true">
            <mat-icon svgIcon="agd:farm"/>
        </div>
    }

    <mat-card-content class="farm-card__content">
        <h3 class="farm-card__name">{{ farm().name }}</h3>
        <p class="farm-card__location">
            <mat-icon class="farm-card__location-icon" svgIcon="agd:location" aria-hidden="true"/>
            {{ farm().location }}
        </p>
        <div class="farm-card__summary">
            <p class="farm-card__meta">
                {{ 'farm.parcelCount' | translate:{ count: farm().parcel.length } }}
                <span aria-hidden="true">·</span>
                {{ 'farm.area' | translate:{ area: (totalArea() | number: '1.0-1') } }}
            </p>
            <a matButton class="farm-card__see-more" routerLink="/parcels" [queryParams]="{ farmId: farm().id }">
                {{ 'farm.button.seeMore' | translate }}
            </a>
        </div>
    </mat-card-content>

    <mat-card-actions class="farm-card__actions">
        <button matButton type="button" (click)="edit.emit(farm().id)">
            <mat-icon svgIcon="agd:edit" aria-hidden="true"/>
            {{ 'farm.button.edit' | translate }}
        </button>
        <button matButton type="button" (click)="delete.emit(farm().id)">
            <mat-icon svgIcon="agd:trash" aria-hidden="true"/>
            {{ 'farm.button.delete' | translate }}
        </button>
    </mat-card-actions>
</mat-card>
