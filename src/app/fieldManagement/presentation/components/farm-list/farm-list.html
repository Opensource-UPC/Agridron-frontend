<header class="farm-list__header">
  <h2>{{ 'farm.title' | translate }}</h2>
  <button matButton>
    <mat-icon>add_circle_outline</mat-icon>
    {{ 'farm.newFarm' | translate }}
  </button>
</header>

@if (error()) {
  <p class="farm-list__error">{{ error() }}</p>
}

<mat-grid-list cols="4" rowHeight="1:1" gutterSize="10px">
  @for (farm of farms(); track farm.id) {
    <mat-grid-tile>
      <app-farm-item [farm]="farm"/>
    </mat-grid-tile>
  } @empty {
    <p>{{ loading() ? ('farm.loading' | translate) : ('farm.empty' | translate) }}</p>
  }
</mat-grid-list>
