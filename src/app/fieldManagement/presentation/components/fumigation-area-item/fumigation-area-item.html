<mat-card class="fumigation-card" appearance="outlined">
    <mat-card-content class="fumigation-card__content">
        <span class="fumigation-card__icon" aria-hidden="true">
            <mat-icon svgIcon="agd:fumigation"/>
        </span>
        <div class="fumigation-card__text">
            <h3 class="fumigation-card__area">
                {{ 'fumigationArea.form.areaValue' | translate:{ area: (fumigationArea().area | number: '1.0-2') } }}
            </h3>
            <p class="fumigation-card__parcel">
                <span class="fumigation-card__parcel-label">{{ 'fumigationArea.parcel' | translate }}</span>
                {{ parcelName() ?? ('#' + fumigationArea().parcelId) }}
            </p>
        </div>
    </mat-card-content>

    <mat-card-actions class="fumigation-card__actions">
        <button matButton type="button" (click)="edit.emit(fumigationArea().id)">
            <mat-icon svgIcon="agd:edit" aria-hidden="true"/>
            {{ 'fumigationArea.button.edit' | translate }}
        </button>
        <button matButton type="button" (click)="delete.emit(fumigationArea().id)">
            <mat-icon svgIcon="agd:trash" aria-hidden="true"/>
            {{ 'fumigationArea.button.delete' | translate }}
        </button>
    </mat-card-actions>
</mat-card>
