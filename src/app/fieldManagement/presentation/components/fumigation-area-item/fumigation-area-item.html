<mat-card class="fumigation-card" appearance="outlined">
    <mat-card-header>
        <mat-card-title>{{ fumigationArea().area }} m²</mat-card-title>
        <mat-card-subtitle>{{ 'fumigationArea.parcel' | translate }}: {{ parcelName() ?? ('#' + fumigationArea().parcelId) }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <div class="fumigation-card__bar" [style.width.%]="areaPercentage()"></div>
    </mat-card-content>
    <mat-card-actions>
        <button matButton (click)="edit.emit(fumigationArea().id)">{{ 'fumigationArea.button.edit' | translate }} <mat-icon>edit</mat-icon></button>
        <button matButton (click)="delete.emit(fumigationArea().id)">{{ 'fumigationArea.button.delete' | translate }} <mat-icon>delete</mat-icon></button>
    </mat-card-actions>
</mat-card>
