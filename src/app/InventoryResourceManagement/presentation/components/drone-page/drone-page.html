<section class="drone-page">
    <div class="drone-page__header">
        <h2>{{ 'drone.title' | translate }}</h2>

        <button mat-flat-button type="button" (click)="onNewDrone()">
            <mat-icon>add</mat-icon>
            {{ 'drone.actions.new' | translate }}
        </button>
    </div>

    @if (error()) {
        <p class="drone-page__error">{{ error() }}</p>
    }

    <app-drone-list
            [drones]="drones()"
            [nozzles]="nozzles()"
            [loading]="loading()"
            (viewDetails)="onViewDetails($event)"
            (viewMaintenance)="onViewMaintenance($event)"/>
</section>
