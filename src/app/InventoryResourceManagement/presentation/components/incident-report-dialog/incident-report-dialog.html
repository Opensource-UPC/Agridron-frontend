

<h2 mat-dialog-title>{{ 'incident.report.title' | translate }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
    <mat-dialog-content class="dialog-body">

        <mat-form-field appearance="outline">
            <mat-label>{{ 'incident.report.description' | translate }}</mat-label>
            <textarea matInput rows="4" maxlength="200" formControlName="description"></textarea>
            <mat-error>{{ 'incident.errors.descriptionRequired' | translate }}</mat-error>
        </mat-form-field>

        <p class="dialog-hint">{{ 'incident.report.hint' | translate }}</p>

    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-button type="button" mat-dialog-close>{{ 'droneForm.cancel' | translate }}</button>
        <button mat-flat-button type="submit" [disabled]="form.invalid">
            {{ 'incident.report.confirm' | translate }}
        </button>
    </mat-dialog-actions>
</form>
