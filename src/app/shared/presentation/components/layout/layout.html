<app-header-content [showMenu]="isAuthenticated()" (menuToggle)="toggleSidebar()"/>

@if (isAuthenticated()) {
    <app-side-nav [open]="sidebarOpen()" (close)="closeSidebar()">
        <main class="layout__content">
            <router-outlet/>
        </main>
        @if (!isAuthPage()) {
            <app-footer-content/>
        }
    </app-side-nav>
} @else {
    <div class="layout__public">
        <main class="layout__content">
            <router-outlet/>
        </main>
        @if (!isAuthPage()) {
            <app-footer-content/>
        }
    </div>
}
