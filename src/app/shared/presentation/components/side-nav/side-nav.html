<mat-sidenav-container class="side-nav">
    <mat-sidenav class="side-nav__panel"
                 [mode]="mode()"
                 [opened]="opened()"
                 (closed)="close.emit()">
        <nav aria-label="Main navigation">
            <mat-nav-list class="side-nav__list">
                @for (option of options; track option.link) {
                    <a mat-list-item
                       class="side-nav__link"
                       [routerLink]="option.link"
                       routerLinkActive="side-nav__link--active"
                       ariaCurrentWhenActive="page"
                       (click)="onNavigate()">
                        <mat-icon matListItemIcon class="side-nav__icon" [svgIcon]="option.icon" aria-hidden="true"/>
                        <span matListItemTitle>{{ option.label | translate }}</span>
                    </a>
                }
            </mat-nav-list>
        </nav>
    </mat-sidenav>
    <mat-sidenav-content class="side-nav__content">
        <ng-content/>
    </mat-sidenav-content>
</mat-sidenav-container>
